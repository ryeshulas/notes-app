<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5c84c">
  <title>Notes</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <link rel="stylesheet" href="/style.css?v=__APP_VERSION__">
</head>
<body>
  <!-- Sign-in -->
  <section id="login" class="screen hidden">
    <form id="login-form" class="login-card">
      <img src="/icon.svg" alt="" width="56" height="56">
      <h1>Notes</h1>
      <input id="login-password" type="password" placeholder="Password" autocomplete="current-password" required>
      <button type="submit">Sign in</button>
      <p id="login-error" class="error"></p>
    </form>
  </section>

  <!-- Main app -->
  <section id="app" class="screen hidden">
    <div id="scrim" class="hidden"></div>
    <aside id="sidebar">
      <div class="brand"><img src="/icon.svg" alt="" width="24" height="24"> Notes</div>
      <nav id="folders"></nav>
      <button id="add-folder" class="link">+ New folder</button>
      <div id="version" class="version">Version __APP_VERSION__</div>
      <div class="sidebar-foot">
        <button id="pin-menu" class="pin-menu" title="Keep the folder menu open">📌 Keep open</button>
        <span id="sync-status" class="sync" title="Sync status">●</span>
        <button id="logout" class="link">Sign out</button>
      </div>
    </aside>

    <main id="list-pane">
      <header class="bar">
        <button id="menu-btn" class="icon-btn" aria-label="Show or hide folders" title="Show or hide folders">☰</button>
        <input id="search" type="search" placeholder="Search notes (use * and ? as wildcards)" title="All words must match. * = any letters, ? = one letter, &quot;quotes&quot; for exact phrases">
        <button id="new-note" class="primary">+ New</button>
      </header>
      <h2 id="list-title"></h2>
      <div id="notes" class="grid"></div>
      <p id="empty" class="empty hidden">No notes here yet.</p>
      <button id="fab" class="fab mobile-only" aria-label="New note">✎</button>
    </main>

    <section id="editor" class="hidden">
      <header class="bar editor-bar">
        <button id="back" class="icon-btn" aria-label="Back">←</button>
        <input id="note-title" placeholder="Title">
        <select id="note-folder" aria-label="Folder"></select>
        <button id="note-pin" class="icon-btn" title="Pin">📌</button>
        <button id="note-popout" class="icon-btn desktop-only" title="Open in its own window">⧉</button>
        <button id="note-delete" class="icon-btn" title="Move to trash">🗑</button>
      </header>
      <div class="colors" id="note-colors"></div>
      <div id="editor-scroll">
        <div class="format-tools">
          <select id="fmt-font" title="Font">
            <option value="">Default font</option>
            <option value="serif">Serif</option>
            <option value="mono">Monospace</option>
            <option value="hand">Handwriting</option>
            <option value="round">Rounded</option>
          </select>
          <button data-fmt="b" class="tool fmt" title="Bold (Ctrl+B)"><b>B</b></button>
          <button data-fmt="i" class="tool fmt" title="Italic (Ctrl+I)"><i>I</i></button>
          <button data-fmt="u" class="tool fmt" title="Underline (Ctrl+U)"><u>U</u></button>
          <button data-fmt="x" class="tool fmt" title="Strikethrough (Ctrl+Shift+X)"><s>S</s></button>
          <button id="fmt-color" class="tool fmt" title="Text color"><span class="fmt-a">A</span><span id="fmt-color-bar" class="fmt-bar"></span></button>
          <button id="fmt-hl" class="tool fmt" title="Highlight"><span class="fmt-hl-icon">ab</span><span id="fmt-hl-bar" class="fmt-bar" style="background:#fff176"></span></button>
        </div>
        <div id="fmt-pop" class="fmt-pop hidden"></div>
        <div class="text-tools">
          <button data-line="ul" class="tool" title="Bulleted list">• List</button>
          <button data-line="ol" class="tool" title="Numbered list">1. List</button>
          <button data-line="todo" class="tool" title="Checklist">☑ Checklist</button>
          <button id="line-outdent" class="tool" title="Move left (Shift+Tab)">⇤</button>
          <button id="line-indent" class="tool" title="Indent / make sub-item (Tab)">⇥</button>
          <button id="clear-done" class="tool" title="Remove checked items">Clear checked</button>
          <button id="text-image" class="tool" title="Insert a picture into the text">🖼 Picture</button>
          <input id="text-image-input" type="file" accept="image/*" hidden>
        </div>
        <div id="note-body" class="note-body"></div>
        <div class="ink-tools">
          <button data-tool="select" class="tool" title="Select, move and resize labels and images"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3l13 8-6 1.5 3.5 7-2.5 1.2-3.4-7L5 18z" fill="#2b2b2b"/></svg></button>
          <button data-tool="pen" class="tool active" title="Pen">✒️</button>
          <button data-tool="highlighter" class="tool" title="Highlighter">🖍️</button>
          <button data-tool="eraser" class="tool" title="Eraser (removes whole strokes)"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M15.2 3.6a2 2 0 0 1 2.8 0l3.4 3.4a2 2 0 0 1 0 2.8L12.3 19H20a1 1 0 1 1 0 2H8.6a2 2 0 0 1-1.4-.6l-4.6-4.6a2 2 0 0 1 0-2.8Z" fill="#f28da0"/><path d="M8.4 10.4l6.2 6.2L12.3 19H8.6l-4.6-4.6Z" fill="#fff" stroke="#c45a70" stroke-width="1.2" stroke-linejoin="round"/><path d="M15.2 3.6a2 2 0 0 1 2.8 0l3.4 3.4a2 2 0 0 1 0 2.8L12.3 19H8.6a2 2 0 0 1-1.4-.6l-4.6-4.6a2 2 0 0 1 0-2.8Z" fill="none" stroke="#9c3a52" stroke-width="1.3" stroke-linejoin="round"/></svg></button>
          <button data-tool="text" class="tool" title="Add a text label: tap where it should go"><span class="tool-t">T</span></button>
          <button id="add-image" class="tool" title="Add an image"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2" fill="#fff" stroke="#2b2b2b" stroke-width="1.6"/><circle cx="9" cy="10" r="1.8" fill="#e0a000"/><path d="M4.5 17.5l5-5 3.5 3.5 2.5-2.5 4 4" fill="none" stroke="#2e7d32" stroke-width="1.6" stroke-linejoin="round"/></svg></button>
          <input id="image-input" type="file" accept="image/*" multiple hidden>
          <span class="sep"></span>
          <span id="ink-colors"></span>
          <span class="sep"></span>
          <select id="ink-width" title="Pen size">
            <option value="2">Fine</option><option value="4" selected>Medium</option><option value="8">Bold</option>
          </select>
          <button id="ink-undo" class="tool" title="Undo">↶</button>
          <button id="ink-more" class="tool" title="Add more drawing space">＋ space</button>
        </div>
        <div id="ink-wrap"><canvas id="ink"></canvas><div id="ink-items" class="ink-items"></div></div>
      </div>
    </section>
  </section>

  <div id="update-banner" class="update-banner hidden">A new version is available. <button id="update-reload">Update now</button></div>

  <script src="/body-editor.js?v=__APP_VERSION__"></script>
  <script src="/canvas-items.js?v=__APP_VERSION__"></script>
  <script src="/app.js?v=__APP_VERSION__"></script>
</body>
</html>
