<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5c84c">
  <title>Notes</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <!-- Sign-in -->
  <section id="login" class="screen hidden">
    <form id="login-form" class="login-card">
      <img src="/icon.svg" alt="" width="56" height="56">
      <h1>Notes</h1>
      <input id="login-password" type="password" placeholder="Password" autocomplete="current-password" required>
      <button type="submit">Sign in</button>
      <p id="login-error" class="error"></p>
    </form>
  </section>

  <!-- Main app -->
  <section id="app" class="screen hidden">
    <div id="scrim" class="hidden"></div>
    <aside id="sidebar">
      <div class="brand"><img src="/icon.svg" alt="" width="24" height="24"> Notes</div>
      <nav id="folders"></nav>
      <button id="add-folder" class="link">+ New folder</button>
      <div class="sidebar-foot">
        <span id="sync-status" class="sync" title="Sync status">●</span>
        <button id="logout" class="link">Sign out</button>
      </div>
    </aside>

    <main id="list-pane">
      <header class="bar">
        <button id="menu-btn" class="icon-btn" aria-label="Show or hide folders" title="Show or hide folders">☰</button>
        <input id="search" type="search" placeholder="Search notes">
        <button id="new-note" class="primary">+ New</button>
      </header>
      <h2 id="list-title"></h2>
      <div id="notes" class="grid"></div>
      <p id="empty" class="empty hidden">No notes here yet.</p>
      <button id="fab" class="fab mobile-only" aria-label="New note">✎</button>
    </main>

    <section id="editor" class="hidden">
      <header class="bar editor-bar">
        <button id="back" class="icon-btn" aria-label="Back">←</button>
        <input id="note-title" placeholder="Title">
        <select id="note-folder" aria-label="Folder"></select>
        <button id="note-pin" class="icon-btn" title="Pin">📌</button>
        <button id="note-popout" class="icon-btn desktop-only" title="Open in its own window">⧉</button>
        <button id="note-delete" class="icon-btn" title="Move to trash">🗑</button>
      </header>
      <div class="colors" id="note-colors"></div>
      <div id="editor-scroll">
        <textarea id="note-text" placeholder="Type here…" rows="2"></textarea>
        <div class="ink-tools">
          <button data-tool="pen" class="tool active" title="Pen">✒️</button>
          <button data-tool="highlighter" class="tool" title="Highlighter">🖍️</button>
          <button data-tool="eraser" class="tool" title="Eraser (removes whole strokes)">⌫</button>
          <span class="sep"></span>
          <span id="ink-colors"></span>
          <span class="sep"></span>
          <select id="ink-width" title="Pen size">
            <option value="2">Fine</option><option value="4" selected>Medium</option><option value="8">Bold</option>
          </select>
          <button id="ink-undo" class="tool" title="Undo">↶</button>
          <button id="ink-more" class="tool" title="Add more drawing space">＋ space</button>
        </div>
        <div id="ink-wrap"><canvas id="ink"></canvas></div>
      </div>
    </section>
  </section>

  <script src="/app.js"></script>
</body>
</html>
