services:
  notes:
    image: ghcr.io/ryeshulas/notes-app:latest
    pull_policy: always   # get the newest image on every deploy
    container_name: notes
    restart: unless-stopped
    ports:
      - "8787:8080"
    environment:
      # Set NOTES_PASSWORD in the stack's environment variables (Dockhand) or a .env file.
      NOTES_PASSWORD: ${NOTES_PASSWORD:?Set NOTES_PASSWORD}
    volumes:
      # Absolute path on the NAS, so the data lands on a share you back up.
      - /volume1/docker/notes/data:/data
